<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikeyBox &mdash; Registreren</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">MikeyBox</div>
        <div class="auth-sub">Account aanmaken</div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form method="post" th:action="@{/register}">
            <div class="field">
                <label for="username">Gebruikersnaam</label>
                <input type="text" id="username" name="username" autofocus autocomplete="username">
            </div>
            <div class="field">
                <label for="password">Wachtwoord</label>
                <input type="password" id="password" name="password" autocomplete="new-password">
            </div>
            <button type="submit" class="btn-lime">Registreren</button>
        </form>

        <div class="auth-footer-link">
            Al een account? <a th:href="@{/login}">Inloggen</a>
        </div>
    </div>
</body>
</html>
