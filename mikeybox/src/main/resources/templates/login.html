<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikeyBox</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">MikeyBox</div>
        <div class="auth-sub">mikeybox.zapto.org</div>

        <div th:if="${param.error}" class="alert alert-error">
            Ongeldige gebruikersnaam of wachtwoord.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            Je bent uitgelogd.
        </div>
        <div th:if="${param.registered}" class="alert alert-success">
            Account aangemaakt &mdash; je kunt nu inloggen.
        </div>

        <form method="post" th:action="@{/login}">
            <div class="field">
                <label for="username">Gebruikersnaam</label>
                <input type="text" id="username" name="username" autofocus autocomplete="username">
            </div>
            <div class="field">
                <label for="password">Wachtwoord</label>
                <input type="password" id="password" name="password" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-lime">Inloggen</button>
        </form>

        <div class="auth-footer-link">
            Nog geen account? <a th:href="@{/register}">Registreren</a>
        </div>
    </div>
</body>
</html>
