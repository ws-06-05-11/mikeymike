<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikeyBox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 4rem;
            letter-spacing: 4px;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            margin-bottom: 1rem;
        }

        .tagline {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 2.5rem;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: #00d4ff;
            color: #0f0f0f;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #00aacc;
        }

        footer {
            position: fixed;
            bottom: 1rem;
            color: #555;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MIKEYBOX</h1>
        <p class="tagline">Welkom op mikeybox.zapto.org</p>
        <a href="#" class="btn">Ga verder</a>
    </div>
    <footer>mikeybox.zapto.org</footer>
</body>
</html>
