<!DOCTYPE html>
<html lang="nl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikeyBox &mdash; Hardlopen</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

    <div th:replace="~{fragments/nav :: topnav('runs')}"></div>

    <!-- Stats strip -->
    <div class="stats-strip" th:if="${!runs.isEmpty()}">
        <div class="stat-cell">
            <div class="stat-label">Trainingen</div>
            <div class="stat-number" th:attr="data-count=${runs.size()}" th:text="${runs.size()}">0</div>
        </div>
        <div class="stat-cell">
            <div class="stat-label">Totaal km</div>
            <div class="stat-number"
                 th:attr="data-count=${#numbers.formatDecimal(totalKm, 1, 1)}"
                 th:text="${#numbers.formatDecimal(totalKm, 1, 1)}">0</div>
            <span class="stat-unit">km</span>
        </div>
        <div class="stat-cell">
            <div class="stat-label">Beste tempo</div>
            <div class="stat-number" th:text="${bestPace}">—</div>
            <span class="stat-unit" th:if="${bestPace != '—'}">/km</span>
        </div>
    </div>

    <!-- Body -->
    <div class="runs-body">

        <!-- Sidebar: add form -->
        <aside class="sidebar">
            <div class="sidebar-title">Training toevoegen</div>
            <form method="post" th:action="@{/runs}">
                <div class="field">
                    <label>Datum</label>
                    <input type="date" name="date" th:value="${today}" required>
                </div>
                <div class="field">
                    <label>Afstand (km)</label>
                    <input type="number" name="distanceKm" step="0.01" min="0.1" placeholder="10.00" required>
                </div>
                <div class="field">
                    <label>Tijd</label>
                    <div class="field-row">
                        <div>
                            <label>Min</label>
                            <input type="number" name="durationMinutes" min="0" placeholder="42" required>
                        </div>
                        <div>
                            <label>Sec</label>
                            <input type="number" name="durationSeconds" min="0" max="59" placeholder="00" required>
                        </div>
                    </div>
                </div>
                <div class="field">
                    <label>Notities (optioneel)</label>
                    <input type="text" name="notes" placeholder="Easy run, intervals...">
                </div>
                <button type="submit" class="btn-lime">Opslaan</button>
            </form>
        </aside>

        <!-- Main: runs list -->
        <main class="main-area">
            <div th:if="${runs.isEmpty()}" class="empty-state">
                Nog geen trainingen &mdash; voeg je eerste toe
            </div>

            <table th:if="${!runs.isEmpty()}" class="runs-table">
                <thead>
                    <tr>
                        <th>Datum</th>
                        <th>Afstand</th>
                        <th>Tijd</th>
                        <th>Tempo</th>
                        <th>Notities</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="run : ${runs}">
                        <td class="td-date" th:text="${run.dateFormatted}"></td>
                        <td class="td-dist">
                            <span th:text="${#numbers.formatDecimal(run.distanceKm, 1, 2)}"></span>
                            <span class="unit">km</span>
                        </td>
                        <td class="td-dur" th:text="${run.durationFormatted}"></td>
                        <td class="td-pace" th:text="${run.pace}"></td>
                        <td class="td-notes" th:text="${run.notes != null ? run.notes : ''}"></td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>

    <script>
        document.querySelectorAll('[data-count]').forEach(function (el) {
            var raw = el.getAttribute('data-count').replace(',', '.');
            var target = parseFloat(raw);
            if (isNaN(target)) { return; }
            var isInt = Number.isInteger(target);
            var duration = 700;
            var start = performance.now();
            function tick(now) {
                var p = Math.min((now - start) / duration, 1);
                var eased = 1 - Math.pow(1 - p, 3);
                el.textContent = isInt
                    ? Math.round(target * eased)
                    : (target * eased).toFixed(1).replace('.', ',');
                if (p < 1) { requestAnimationFrame(tick); }
            }
            requestAnimationFrame(tick);
        });
    </script>
</body>
</html>
