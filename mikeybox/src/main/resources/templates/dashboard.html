<!DOCTYPE html>
<html lang="nl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikeyBox</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="dash-page">
    <div class="dash-logo a1">MIKEYBOX</div>
    <div class="dash-rule a2"></div>
    <div class="dash-welcome a2">
        Welkom, <span sec:authentication="name">gebruiker</span>
    </div>

    <div class="module-list a3">
        <a th:href="@{/runs}" class="module-tile">
            <div class="module-text">
                <span class="module-name">Hardlopen</span>
                <span class="module-desc">log je trainings runs</span>
            </div>
            <span class="module-arrow">&#x2192;</span>
        </a>
        <a th:href="@{/weight}" class="module-tile">
            <div class="module-text">
                <span class="module-name">Gewicht</span>
                <span class="module-desc">volg je gewicht over tijd</span>
            </div>
            <span class="module-arrow">&#x2192;</span>
        </a>
        <a th:href="@{/standby}" class="module-tile">
            <div class="module-text">
                <span class="module-name">Standby</span>
                <span class="module-desc">rooster &amp; rotatie</span>
            </div>
            <span class="module-arrow">&#x2192;</span>
        </a>
        <a th:href="@{/vakantie}" class="module-tile">
            <div class="module-text">
                <span class="module-name">Vakantie</span>
                <span class="module-desc">verlofperiodes per persoon</span>
            </div>
            <span class="module-arrow">&#x2192;</span>
        </a>
    </div>

    <form method="post" th:action="@{/logout}" class="a4">
        <button type="submit" class="btn-ghost-danger">Uitloggen</button>
    </form>
</body>
</html>
